name: Release

# Push a tag like v1.0.1 to build the plugin and publish Decky-WoL.zip as a GitHub release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build plugin zip
        run: bash package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/Decky-WoL.zip --generate-notes --latest
